<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexora - MacOS</title>

<style>

:root{
    --background:#0f172a;
    --surface:#111e35;
    --accent:#38bdf8;
    --accent-hover:#7dd3fc;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border:rgba(148,163,184,.15);
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    font-family:'Segoe UI',sans-serif;

    background:#0f172a;

    background-image:
    radial-gradient(
        ellipse at 50% 0%,
        rgba(14,165,233,.09),
        transparent 55%
    );

    color:var(--text);

}

.main{

    max-width:900px;

    margin:auto;

    padding:80px 20px;

    text-align:center;

}

h1{

    color:var(--accent);

    font-size:clamp(2.8rem,7vw,4.2rem);

    margin-bottom:20px;

}

.card{

    background:#111e35;

    border:1px solid var(--border);

    border-radius:16px;

    padding:30px;

    max-width:600px;

    margin:auto;

}

.card p{

    color:var(--muted);

    font-size:1.1rem;

}

.back-btn{

    display:inline-block;

    margin-top:30px;

    background:#0ea5e9;

    color:#082f49;

    text-decoration:none;

    padding:12px 20px;

    border-radius:10px;

    font-weight:700;

}

footer{

    margin-top:60px;

    text-align:center;

    color:#64748b;

}

</style>

</head>

<body>

<div class="main">

<h1>Nexora - MacOS</h1>

<div class="card">

<p>

Bisher keine Inhalte.

</p>

</div>

<a
href="OS.html"
class="back-btn">

Zurück

</a>

<footer>

© Nexora – MacOS

</footer>

</div>

</body>
</html>
