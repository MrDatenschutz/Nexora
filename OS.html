<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OS projects</title>

<style>

:root {
    --background:#0f172a;
    --surface:#111e35;
    --accent:#38bdf8;
    --accent-hover:#7dd3fc;
    --text:#e5e7eb;
    --muted:#94a3b8;
    --border:rgba(148,163,184,0.15);
}

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;

    font-family:'Segoe UI',sans-serif;

    background:#0f172a;

    background-image:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(14,165,233,0.09),
            transparent 55%
        );

    background-repeat:no-repeat;
    background-size:100% 700px;

    color:var(--text);

}

.main-container{

    max-width:1000px;

    margin:0 auto;

    padding:80px 20px 60px;

    text-align:center;

}

h1{

    font-size:clamp(
        2.8rem,
        7vw,
        4.2rem
    );

    margin:0;

    font-weight:800;

    letter-spacing:-2px;

    color:var(--accent);

    text-shadow:
        0 0 20px
        rgba(
            56,
            189,
            248,
            0.12
        );

}

.subtitle{

    font-size:1.1rem;

    color:var(--muted);

    margin-top:15px;

    margin-bottom:50px;

}

.os-container{

    max-width:650px;

    margin:0 auto;

}

.os-button{

    display:block;

    width:100%;

    margin-bottom:20px;

    padding:22px;

    border-radius:16px;

    text-decoration:none;

    background:
        rgba(
            17,
            30,
            53,
            0.95
        );

    border:
        1px solid
        var(--border);

    color:var(--accent);

    font-size:1.2rem;

    font-weight:700;

    transition:.2s ease;

}

.os-button:hover{

    transform:
        translateY(-2px);

    background:#17263f;

    border-color:
        rgba(
            56,
            189,
            248,
            0.4
        );

}

.back-btn{

    display:inline-block;

    margin-top:20px;

    background:#0ea5e9;

    color:#082f49;

    text-decoration:none;

    padding:12px 20px;

    border-radius:10px;

    font-size:0.95rem;

    font-weight:700;

    transition:.2s ease;

}

.back-btn:hover{

    background:var(--accent-hover);

    transform:
        translateY(-1px);

    box-shadow:
        0 0 12px
        rgba(
            56,
            189,
            248,
            0.15
        );

}

footer{

    margin-top:70px;

    padding:22px 20px;

    text-align:center;

    border-top:
        1px solid
        var(--border);

    color:#64748b;

    font-size:.85rem;

}

footer span{

    color:var(--accent);

}

</style>

</head>

<body>

<main class="main-container">

    <h1>Nexora OS</h1>

    <p class="subtitle">
        Handbooks & Projects
    </p>

    <div class="os-container">

        <a
        class="os-button"
        href="https://mrdatenschutz.github.io/Nexora/MacOS.html">
            MacOS
        </a>

        <a
        class="os-button"
        href="https://mrdatenschutz.github.io/Nexora/Windows.html">
            Windows
        </a>

        <a
        class="os-button"
        href="https://mrdatenschutz.github.io/Nexora/Linux.html">
            Linux
        </a>

        <a
        href="index.html"
        class="back-btn">
            Zur Startseite
        </a>

    </div>

</main>

<footer>

    <p>
        © <span>Nexora</span> – Operating Systems
    </p>

</footer>

</body>
</html>
