<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Quiz</title>

<style>

/* ==============================
   NEXORA QUIZ DESIGN
============================== */

:root{

    --background:#0f172a;
    --surface:#111e35;
    --surface-light:#17263f;

    --accent:#38bdf8;
    --accent-hover:#7dd3fc;

    --text:#e5e7eb;
    --muted:#94a3b8;

    --border:
        rgba(148,163,184,0.15);

}

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    font-family:'Segoe UI',
                sans-serif;

    background:#0f172a;

    background-image:
        radial-gradient(
            ellipse at 50% 0%,
            rgba(
                14,
                165,
                233,
                0.09
            ),
            transparent 55%
        );

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px;

    color:var(--text);

}

.card{

    width:720px;

    max-width:95%;

    padding:25px;

    border-radius:18px;

    background:
        rgba(
            17,
            30,
            53,
            0.95
        );

    border:
        1px solid
        var(--border);

    box-shadow:
        0 8px 20px
        rgba(
            0,
            0,
            0,
            0.12
        );

    animation:
        fadeIn
        .4s
        ease;

}

@keyframes fadeIn{

    from{
        opacity:0;
        transform:
            translateY(10px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }

}

#question{

    color:var(--accent);

    margin-top:0;

    line-height:1.5;

}

.option{

    background:
        rgba(
            17,
            30,
            53,
            0.95
        );

    border:
        1px solid
        var(--border);

    padding:14px;

    border-radius:12px;

    margin:10px 0;

    cursor:pointer;

    transition:.2s ease;

}
  .option:hover{

    transform:translateY(-2px);

    background:#17263f;

    border-color:
        rgba(
            56,
            189,
            248,
            0.4
        );

}

.correct{

    background:
        rgba(
            34,
            197,
            94,
            .25
        ) !important;

    border-color:
        rgba(
            34,
            197,
            94,
            .7
        ) !important;

}

.wrong{

    background:
        rgba(
            239,
            68,
            68,
            .25
        ) !important;

    border-color:
        rgba(
            239,
            68,
            68,
            .7
        ) !important;

}

#nextBtn{

    margin-top:20px;

    width:100%;

    padding:12px;

    border:none;

    border-radius:10px;

    background:#0ea5e9;

    color:#082f49;

    font-size:16px;

    font-weight:700;

    cursor:pointer;

    display:none;

    transition:.2s ease;

}

#nextBtn:hover{

    background:#7dd3fc;

}

#explanation{

    margin-top:15px;

    color:#94a3b8;

}

/* ==========
   AUSWERTUNG
=========== */

.result-card{

    padding:16px;

    margin-bottom:15px;

    border-radius:12px;

}

.result-correct{

    background:
        rgba(
            34,
            197,
            94,
            .15
        );

    border:
        1px solid
        rgba(
            34,
            197,
            94,
            .5
        );

}

.result-wrong{

    background:
        rgba(
            239,
            68,
            68,
            .15
        );

    border:
        1px solid
        rgba(
            239,
            68,
            68,
            .5
        );

}

.result-title{

    font-weight:700;

    font-size:1.1rem;

    margin-bottom:10px;

}

.result-question{

    color:#e5e7eb;

    margin-bottom:10px;

}

.result-answer{

    color:#94a3b8;
}

.result-correct-answer{

    color:#38bdf8;

    margin-top:10px;
}

</style>

</head>

<body>

<div class="card">

<h2 id="question"></h2>

<div id="options"></div>

<div id="explanation"></div>

<button id="nextBtn">
    Nächste Frage
</button>

</div>

<script>

const quiz = [

/* HIER BEGINNT DEIN
   KOMPLETTES QUIZ ARRAY */
  ];

let current = 0;
let score = 0;

let userAnswers = [];

const qEl =
    document.getElementById('question');

const oEl =
    document.getElementById('options');

const eEl =
    document.getElementById('explanation');

const nextBtn =
    document.getElementById('nextBtn');

/* ==========================
   FRAGE LADEN
========================== */

function loadQuestion() {

    const q = quiz[current];

    qEl.textContent =
        q.question;

    oEl.innerHTML = '';

    eEl.innerHTML = '';

    nextBtn.style.display =
        'none';

    q.options.forEach(
        function(text,index){

            const btn =
                document.createElement('div');

            btn.className =
                'option';

            btn.textContent =
                text;

            btn.onclick =
                function(){

                document
                .querySelectorAll(
                    '.option'
                )
                .forEach(
                    function(o){

                    o.style.pointerEvents =
                        'none';

                });

                userAnswers.push(index);

                if(
                    index === q.correct
                ){

                    btn.classList.add(
                        'correct'
                    );

                    score++;

                }else{

                    btn.classList.add(
                        'wrong'
                    );

                }

                nextBtn.style.display =
                    'block';

            };

            oEl.appendChild(btn);

    });

}

/* ==========================
   NÄCHSTE FRAGE
========================== */

nextBtn.onclick =
    function(){

    current++;

    if(
        current < quiz.length
    ){
        loadQuestion();
    }
    else{
        showResults();
    }

};
  /* ==========================
   AUSWERTUNG
========================== */

function showResults() {

    const percent =
        (
            score /
            quiz.length *
            100
        ).toFixed(1);

    qEl.innerHTML = `

        🎯 Ergebnis

        <div style="
            margin-top:20px;
            font-size:2.2rem;
            color:#38bdf8;
        ">
            ${score} / ${quiz.length}
        </div>

        <div style="
            color:#94a3b8;
            margin-top:8px;
        ">
            ${percent}% richtig
        </div>

    `;

    oEl.innerHTML = '';
    eEl.innerHTML = '';

    nextBtn.style.display =
        'none';

    quiz.forEach(
        function(q,i){

        const correct =
            userAnswers[i]
            ===
            q.correct;

        const card =
            document.createElement(
                'div'
            );

        card.className =
            correct
            ? 'result-card result-correct'
            : 'result-card result-wrong';

        card.innerHTML = `

            <div
                class="result-title"
                style="
                  color:${
                    correct
                    ? '#22c55e'
                    : '#ef4444'
                  };
                "
            >

                ${
                    correct
                    ? '✅ Richtig'
                    : '❌ Falsch'
                }

            </div>

            <div
                class="result-question"
            >
                ${q.question}
            </div>

            <div
                class="result-answer"
            >
                <strong>
                Deine Antwort:
                </strong>
                <br>

                ${
                    q.options[
                        userAnswers[i]
                    ]
                    || 'Keine Antwort'
                }

            </div>

            ${
              !correct
              ?
              `
              <div
              class="
                result-correct-answer
              ">
                <strong>
                Richtige Antwort:
                </strong>
                <br>

                ${
                    q.options[
                        q.correct
                    ]
                }
              </div>
              `
              :
              ''
            }

        `;

        oEl.appendChild(card);

    });

}

/* ==========================
   QUIZ STARTEN
========================== */

loadQuestion();

</script>

</body>
</html>
