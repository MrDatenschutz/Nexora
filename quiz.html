<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Quiz</title><style>body{font-family:Arial;background:linear-gradient(135deg,#6a11cb,#2575fc);padding:40px;display:flex;justify-content:center;}.card{background:white;width:520px;padding:25px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,0.3);animation:fadeIn 0.5s ease;}@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}.option{background:#f0f0f0;padding:12px;border-radius:10px;margin:10px 0;cursor:pointer;border:2px solid transparent;transition:0.2s;}.option:hover{background:#e0e0e0;}.correct{background:#c8f7c5!important;border-color:#2ecc71;}.wrong{background:#f7c5c5!important;border-color:#e74c3c;}#nextBtn{margin-top:20px;padding:12px;width:100%;background:#3498db;color:white;border:none;border-radius:10px;font-size:16px;cursor:pointer;display:none;}#nextBtn:hover{background:#217dbb;}</style></head><body><div class='card'><h2 id='question'></h2><div id='options'></div><div id='explanation'></div><button id='nextBtn'>Nächste Frage</button></div><script>const quiz=[{"question":"Welche Stadt ist die Hauptstadt von Kanada?","options":["Toronto","Ottawa","Vancouver"],"correct":1,"explanation":""},{"question":"Welches ist das größte Meerestier?","options":["Weißer Hai","Blauwal","Orca"],"correct":1,"explanation":""},{"question":"Wie viele Planeten hat unser Sonnensystem?","options":["10","9","8"],"correct":2,"explanation":""},{"question":"Wer schrieb \"Faust\"?","options":["Johann Wolfgang von Goethe","Friedrich Schiller","Thomas Mann"],"correct":0,"explanation":""},{"question":"Welches Land hat die meisten Einwohner?","options":["USA","Indien","China"],"correct":1,"explanation":""},{"question":"Wie heißt das längste Fließgewässer der Welt?","options":["Amazonas","Nil","Mississippi"],"correct":0,"explanation":""},{"question":"Welche Farbe hat Chlor?","options":["Rot","Gelbgrün","Blau"],"correct":1,"explanation":""},{"question":"Wer erfand das Telefon?","options":["Alexander Graham Bell","Nikola Tesla","Thomas Edison"],"correct":0,"explanation":""},{"question":"Wie viele Bundesländer hat Deutschland?","options":["14","15","16"],"correct":2,"explanation":""},{"question":"Welche Stadt nennt man \"Big Apple\"?","options":["New York City","Los Angeles","Chicago"],"correct":0,"explanation":""},{"question":"Welches Tier legt Eier?","options":["Krokodil","Delfin","Katze"],"correct":0,"explanation":""},{"question":"Wie heißt der höchste Berg der Erde?","options":["K2","Kangchendzönga","Mount Everest"],"correct":2,"explanation":""},{"question":"Welches Gas atmen wir hauptsächlich ein?","options":["Sauerstoff","Stickstoff","Kohlendioxid"],"correct":1,"explanation":""},{"question":"Wer malte \"Das Sternennacht\"?","options":["Claude Monet","Vincent van Gogh","Edvard Munch"],"correct":1,"explanation":""},{"question":"Welche Währung hat Japan?","options":["Won","Yen","Yuan"],"correct":1,"explanation":""},{"question":"Wie viele Zähne hat ein Erwachsener normalerweise?","options":["32","28","30"],"correct":0,"explanation":""},{"question":"Welche Sprache hat weltweit die meisten Muttersprachler?","options":["Englisch","Mandarin‑Chinesisch","Spanisch"],"correct":1,"explanation":""},{"question":"Wie heißt das größte Land der Erde?","options":["USA","Kanada","Russland"],"correct":2,"explanation":""},{"question":"Wer war der erste Mensch auf dem Mond?","options":["Buzz Aldrin","Neil Armstrong","Yuri Gagarin"],"correct":1,"explanation":""},{"question":"Welche Stadt liegt am Bosporus?","options":["Ankara","Istanbul","Izmir"],"correct":1,"explanation":""},{"question":"Wie heißt der längste Fluss Europas?","options":["Rhein","Donau","Wolga"],"correct":2,"explanation":""},{"question":"Welche Form hat die Erde?","options":["Perfekte Kugel","Ellipsoid","Würfel"],"correct":1,"explanation":""},{"question":"Wie nennt man die Wissenschaft der Karten?","options":["Kartografie","Geologie","Topografie"],"correct":0,"explanation":""},{"question":"Wer komponierte die „9. Sinfonie“?","options":["Beethoven","Mozart","Bach"],"correct":0,"explanation":""},{"question":"Welche ist die kleinste Einheit des Lebens?","options":["Atom","Zelle","Molekül"],"correct":1,"explanation":""},{"question":"Welches Land ist für die Pyramiden bekannt?","options":["Mexiko","Ägypten","Indien"],"correct":1,"explanation":""},{"question":"Wie heißt der größte Ozean?","options":["Atlantik","Indischer Ozean","Pazifik"],"correct":2,"explanation":""},{"question":"Welche Sprache spricht man in Brasilien?","options":["Spanisch","Brasilianisch","Portugiesisch"],"correct":2,"explanation":""},{"question":"Wie viele Spieler stehen beim Fußball pro Team auf dem Platz?","options":["9","10","11"],"correct":2,"explanation":""},{"question":"Welches Metall leitet Strom am besten?","options":["Kupfer","Silber","Gold"],"correct":1,"explanation":""},{"question":"Wer war Albert Einstein?","options":["Musiker","Physiker","Maler"],"correct":1,"explanation":""},{"question":"Welche Stadt ist die Hauptstadt von Italien?","options":["Neapel","Mailand","Rom"],"correct":2,"explanation":""},{"question":"Wie heißt der größte Kontinent?","options":["Afrika","Asien","Europa"],"correct":1,"explanation":""},{"question":"Welche Farbe hat die Sonne?","options":["Weiß","Gelb","Orange"],"correct":0,"explanation":""},{"question":"Wie nennt man einen jungen Hund?","options":["Kalb","Fohlen","Welpe"],"correct":2,"explanation":""},{"question":"Welche Einheit misst elektrische Spannung?","options":["Volt","Ampere","Watt","Ohm"],"correct":0,"explanation":""},{"question":"Wer schrieb \"Harry Potter\"?","options":["J. R. R. Tolkien","J. K. Rowling","Stephen King"],"correct":1,"explanation":""},{"question":"Welche Stadt liegt an der Themse?","options":["London","Manchester","Birmingham"],"correct":0,"explanation":""},{"question":"Wie heißt der größte Planet im Sonnensystem?","options":["Saturn","Jupiter","Uranus"],"correct":1,"explanation":""},{"question":"Welche Farbe hat ein Smaragd?","options":["Blau","Grün","Rot"],"correct":1,"explanation":""},{"question":"Wie nennt man einen Wissenschaftler, der Fossilien untersucht?","options":["Paläontologe","Archäologe","Biologe"],"correct":0,"explanation":""},{"question":"Welche Stadt ist die Hauptstadt von Spanien?","options":["Valencia","Barcelona","Madrid"],"correct":2,"explanation":""},{"question":"Wie heißt der schnellste Landläufer?","options":["Tiger","Löwe","Gepard","Gephard"],"correct":2,"explanation":""},{"question":"Welche Sprache spricht man in Österreich?","options":["Deutsch","Französisch","Italienisch"],"correct":0,"explanation":""},{"question":"Wie nennt man die Lehre vom Wetter?","options":["Meteorologie","Klimatologie","Astronomie"],"correct":0,"explanation":""},{"question":"Welche Form hat ein Stoppschild?","options":["Dreieck","Achteck","Kreis"],"correct":1,"explanation":""},{"question":"Wie heißt der längste Knochen im menschlichen Körper?","options":["Oberschenkelknochen","Schienbein","Oberarmknochen"],"correct":0,"explanation":""},{"question":"Welche Stadt ist die Hauptstadt von Schweden?","options":["Helsinki","Oslo","Stockholm"],"correct":2,"explanation":""},{"question":"Welche Farbe hat Blut im Körper?","options":["Blau","Rot","Gelb"],"correct":1,"explanation":""},{"question":"Wie heißt der größte See Afrikas?","options":["Tanganjikasee","Victoriasee","Malawisee"],"correct":1,"explanation":""},{"question":"Wie nennt man die Wiederholung desselben Anfangslauts in mehreren Wörtern?","options":["Alliterazion","Aliteration","Alliteration"],"correct":2,"explanation":""},{"question":"Welcher Begriff bezeichnet die Umstellung der üblichen Wortstellung im Satz?","options":["Hyperbathon","Hyperbatom","Hyperbaton"],"correct":2,"explanation":""},{"question":"Wie nennt man den sprachlichen Ausdruck, bei dem ein Wort bildhaft für etwas anderes steht?","options":["Methaper","Metapher","Methapher","Oxymoron"],"correct":1,"explanation":""}];let current=0;let score=0;let userAnswers=[];const qEl=document.getElementById('question');const oEl=document.getElementById('options');const eEl=document.getElementById('explanation');const nextBtn=document.getElementById('nextBtn');function loadQuestion(){const q=quiz[current];qEl.textContent=q.question;oEl.innerHTML='';eEl.innerHTML='';nextBtn.style.display='none';q.options.forEach(function(text,index){const btn=document.createElement('div');btn.className='option';btn.textContent=text;btn.onclick=function(){document.querySelectorAll('.option').forEach(function(o){o.style.pointerEvents='none'});userAnswers.push(index);if(index===q.correct){btn.classList.add('correct');score++;}else{btn.classList.add('wrong');}eEl.innerHTML=q.explanation;nextBtn.style.display='block';};oEl.appendChild(btn);});}nextBtn.onclick=function(){current++;if(current<quiz.length)loadQuestion();else showResults();};function showResults(){qEl.textContent='Auswertung';oEl.innerHTML='';eEl.innerHTML='';quiz.forEach(function(q,i){const div=document.createElement('div');div.innerHTML='<b>'+q.question+'</b><br>Deine Antwort: '+(q.options[userAnswers[i]]||'Keine')+'<br>Richtige Antwort: <b>'+q.options[q.correct]+'</b><br><br>';oEl.appendChild(div);});}loadQuestion();</script></body></html>
